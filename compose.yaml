# ============================================================================
#  EJERCICIO — Lab 2 (Clase 3): completar la orquestación con docker compose
# ============================================================================
#
#  La aplicación ya está migrada a PostgreSQL. El servicio `db` está COMPLETO,
#  como ejemplo de referencia. Tu tarea es completar los TODO de `flyway`,
#  `api` y `frontend` para que un solo comando levante toda la plataforma:
#
#      docker compose up --build
#      # luego abre http://localhost:3000
#
#  Pistas sobre depends_on (controla el orden de arranque):
#       condition: service_healthy                -> espera al healthcheck OK
#       condition: service_completed_successfully -> espera a que el servicio termine
# ============================================================================

services:
  # --- db: COMPLETO (úsalo como ejemplo) ------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data      # volumen nombrado (persistencia)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- flyway: aplica las migraciones de db/migrations ----------------------
  flyway:
    image: flyway/flyway
    # Aplica las migraciones pendientes (V1..V5) en orden y termina.
    # Usa el NOMBRE de servicio "db" como host (red interna de compose).
    command: -url=jdbc:postgresql://db/incidents -user=postgres -password=dev migrate
    volumes:
      - ./db/migrations:/flyway/sql      # los .sql versionados que aplica Flyway
    depends_on:
      db:
        condition: service_healthy       # espera a que Postgres acepte conexiones

  # --- api: backend Flask ---------------------------------------------------
  api:
    build: .
    # Factor III (12-Factor): la config vive en el environment.
    # Host = "db" (nombre del servicio), no "localhost".
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/incidents
    depends_on:
      flyway:
        condition: service_completed_successfully   # arranca tras migrar el schema

  # --- frontend: Nginx sirve los estáticos y proxea /api/ -------------------
  frontend:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes:
      - ./static:/usr/share/nginx/html/static:ro
      - ./static/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
