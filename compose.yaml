# -- Compose LG 20260621
services:
  # --- db: COMPLETO (úsalo como ejemplo) ------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data      # volumen nombrado (persistencia)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- flyway: aplica las migraciones de db/migrations ----------------------
  flyway:
    image: flyway/flyway
    command: -url=jdbc:postgresql://db/incidents -user=postgres -password=dev migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  # --- api: backend Flask ---------------------------------------------------
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/incidents
    depends_on:
      flyway:
        condition: service_completed_successfully

  # --- frontend: Nginx sirve los estáticos y proxea /api/ -------------------
  frontend:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes:
        - ./static/index.html:/usr/share/nginx/html/index.html:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  